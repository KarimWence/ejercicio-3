<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos con Impacto Social - ODS</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Color de tema justificado desde el encabezado CSS -->
  <meta name="theme-color" content="#ffffff" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- Soporte para iOS / Safari -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ProyectosODS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Pantalla de inicio para iOS (apple-touch-startup-image) -->
  <link
    rel="apple-touch-startup-image"
    href="icons/splash-1179x2556.png"
    media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
  />

  <!-- Tipografias externas para identidad visual -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos divididos: Shell (fijo) y Content (dinamico) -->
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- App Shell: Header y Navegacion Fijos -->
  <header class="site-header">
    <a href="#/" data-link class="brand">
      <span class="brand__mark">●</span> Proyectos<span class="brand__accent">ODS</span>
    </a>
    <nav class="site-nav">
      <a href="#/" data-link>Inicio</a>
      <a href="#/noticias" data-link>Noticias</a>
      <a href="#/favoritos" data-link>Favoritos</a>
      <a href="#/colaborar" data-link>Colaborar</a>
      <a href="#/acerca" data-link>Acerca de</a>
      <a href="#/diagnostico" data-link>Diagnóstico</a>
      <a href="#/service-worker" data-link>Service Worker</a>
    </nav>
  </header>

  <!-- App Shell Container: Inyeccion de Vistas con Skeleton inicial -->
  <main id="app" class="app-root">
    <div class="skeleton" role="status" aria-label="Cargando contenido">
      <div class="skeleton__line skeleton__line--title"></div>
      <div class="skeleton__line skeleton__line--wide"></div>
      <div class="skeleton__line" style="width: 40%"></div>
      <div class="skeleton__grid">
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
      </div>
    </div>
  </main>

  <!-- App Shell: Footer Fijo -->
  <footer class="site-footer">
    <p>Red Social Academica con Enfoque en Impacto Social · ODS 2030</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
