<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos con Impacto Social - ODS</title>
  
  <!-- Tipografias externas para identidad visual -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos divididos: Shell (fijo) y Content (dinamico) -->
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- ==========================================
       APP SHELL: Estructura fija de la aplicacion
       (Header, Navegacion, Contenedor raiz y Footer)
       ========================================== -->
<header class="site-header">
    <a href="#/" data-link class="brand">
        <span class="brand__mark">●</span>
        Proyectos<span class="brand__accent">ODS</span>
    </a>

<nav class="site-nav">
    <a href="#/" data-link>Inicio</a>
    <a href="#/noticias" data-link>Noticias</a>
    <a href="#/favoritos" data-link>Favoritos</a>
    <a href="#/acerca" data-link>Acerca de</a>
    <a href="#/diagnostico" data-link>Diagnóstico</a>
    <a href="/service-worker" data-link>Service Worker</a>
</nav>

<button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    aria-label="Cambiar a tema oscuro"
    title="Cambiar tema"
>
    <!-- Sol: se muestra en tema claro -->
    <svg
        class="theme-toggle__icon theme-toggle__icon--sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.42 1.42"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.35 17.66-1.42 1.41"></path>
        <path d="m19.07 4.93-1.41 1.42"></path>
    </svg>

    <!-- Luna: se muestra en tema oscuro -->
    <svg
        class="theme-toggle__icon theme-toggle__icon--moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
    </svg>

    <span class="theme-toggle__text theme-toggle__text--light">
        Claro
    </span>

    <span class="theme-toggle__text theme-toggle__text--dark">
        Oscuro
    </span>
</button>
</header>

  <!-- CONTENEDOR RAIZ: El router solo reemplaza lo que hay dentro de #app.
       Incluye el skeleton inicial en el HTML estatico del App Shell para que
       sea visible de inmediato mientras el JavaScript carga y resuelve la ruta. -->
  <main id="app" class="app-root">
    <div class="skeleton" role="status" aria-label="Cargando contenido">
      <div class="skeleton__line skeleton__line--title"></div>
      <div class="skeleton__line skeleton__line--wide"></div>
      <div class="skeleton__line" style="width: 40%"></div>
      <div class="skeleton__grid">
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Red Social Academica con Enfoque en Impacto Social · ODS 2030</p>
  </footer>
  <!-- ==========================================
       FIN DEL APP SHELL
       ========================================== -->

  <script type="module" src="src/main.js"></script>
</body>
</html>
